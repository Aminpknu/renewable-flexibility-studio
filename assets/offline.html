<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102b2a">
  <title>Renewable Flexibility Studio · Offline</title>
  <style>
    body{margin:0;font-family:Arial,sans-serif;background:#f5f7f6;color:#173332;display:grid;min-height:100vh;place-items:center;padding:24px;box-sizing:border-box}
    main{max-width:620px;background:white;border:1px solid #d9e2df;border-radius:12px;padding:28px;box-shadow:0 10px 30px rgba(16,43,42,.08)}
    h1{font-size:1.7rem;margin:0 0 12px} p{line-height:1.55;color:#49615f} .tag{font-size:.78rem;font-weight:700;letter-spacing:.08em;color:#2b6b63;margin-bottom:12px}
    button{background:#102b2a;color:white;border:0;border-radius:8px;padding:11px 16px;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <div class="tag">RENEWABLE FLEXIBILITY STUDIO</div>
    <h1>You’re offline</h1>
    <p>The installed app can open this offline screen, but live forecasts, optimisation callbacks and fresh market data need an internet connection. If the Studio was already open, that browser view can remain visible until you reconnect.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
