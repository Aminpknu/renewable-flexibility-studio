name: Airflow DAG smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "airflow/**"
      - "cloud/**"
      - ".github/workflows/airflow-smoke.yml"

jobs:
  airflow-smoke:
    runs-on: ubuntu-latest
    env:
      AIRFLOW_HOME: "${{ runner.temp }}/airflow"
      AIRFLOW__CORE__DAGS_FOLDER: "${{ github.workspace }}/airflow/dags"
      PYTHONPATH: "${{ github.workspace }}"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Airflow
        run: >-
          python -m pip install apache-airflow==3.3.1
          --constraint https://raw.githubusercontent.com/apache/airflow/constraints-3.3.1/constraints-3.12.txt
      - name: Install boto3
        run: python -m pip install "boto3>=1.40,<2"
      - name: Initialise Airflow metadata database
        run: airflow db migrate
      - name: Verify DAG discovery
        run: airflow dags list | grep rfs_validated_bundle_to_s3
      - name: Execute validation task
        run: airflow tasks test rfs_validated_bundle_to_s3 validate_bundle 2026-09-15
