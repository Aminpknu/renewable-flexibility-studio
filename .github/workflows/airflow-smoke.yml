name: Airflow DAG smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "airflow/**"
      - "cloud/**"
      - ".github/workflows/airflow-smoke.yml"

jobs:
  airflow-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure Airflow environment
        run: |
          echo "AIRFLOW_HOME=$RUNNER_TEMP/airflow" >> "$GITHUB_ENV"
          echo "AIRFLOW__CORE__DAGS_FOLDER=$GITHUB_WORKSPACE/airflow/dags" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Install Airflow
        run: >-
          python -m pip install apache-airflow==3.3.1
          --constraint https://raw.githubusercontent.com/apache/airflow/constraints-3.3.1/constraints-3.12.txt
      - name: Install boto3
        run: python -m pip install "boto3>=1.40,<2"
      - name: Initialise Airflow metadata database
        run: airflow db migrate
      - name: Show DAG diagnostics
        run: |
          echo "DAGS_FOLDER=$AIRFLOW__CORE__DAGS_FOLDER"
          find "$AIRFLOW__CORE__DAGS_FOLDER" -maxdepth 2 -type f -print
          python airflow/dags/rfs_cloud_pipeline.py || true
          airflow dags list-import-errors || true
          airflow dags list || true
      - name: Verify DAG discovery
        run: airflow dags list | grep rfs_validated_bundle_to_s3
      - name: Execute validation task
        run: airflow tasks test rfs_validated_bundle_to_s3 validate_bundle 2026-09-15
