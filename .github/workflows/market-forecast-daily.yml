name: Publish market forecast bundle

on:
  schedule:
    - cron: "15 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-forecast-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Refresh market forecast atomically
        run: python -m scripts.run_market_forecast_pipeline
      - name: Validate market bundle
        run: python -m pytest -q tests/test_market_forecast_bundle.py tests/test_data_contract.py
      - name: Commit changed bundle/status
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "No market bundle changes to commit."
          else
            git commit -m "Refresh market forecast bundle [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
